after-startup-command = [
    'exec-and-forget brew services restart borders'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

# ============================================================
# MONITOR ASSIGNMENT
#   Verify names with:  aerospace list-monitors
#   'secondary' should resolve to the ultrawide; replace with a
#   real name substring (e.g. 'LG', 'DELL') if it doesn't match.
# ============================================================
[workspace-to-monitor-force-assignment]
    A = ['secondary', 'built-in']       # Code (IDE)
    S = ['secondary', 'built-in']       # Terminal
    D = ['secondary', 'built-in']       # AI (Claude + browser)
    W = ['secondary', 'built-in']       # Web
    Q = ['secondary', 'built-in']       # Design (Photoshop / Illustrator)
    E = ['secondary', 'built-in']       # Files (Finder)
    F = 'built-in'        # Comms (Slack / Teams)
    R = 'built-in'        # Email (Outlook)

# ============================================================
#   MAIN BINDING MODE
#   ALL main-mode bindings must live contiguously under this
#   one header. Do NOT insert another [table] header between them.
# ============================================================
[mode.main.binding]

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-cmd-ctrl-slash = 'layout h_tiles'
    alt-cmd-ctrl-comma = 'layout v_accordion'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-cmd-ctrl-h = 'focus left --boundaries-action wrap-around-the-workspace'
    alt-cmd-ctrl-j = 'focus down --boundaries-action wrap-around-the-workspace'
    alt-cmd-ctrl-k = 'focus up --boundaries-action wrap-around-the-workspace'
    alt-cmd-ctrl-l = 'focus right --boundaries-action wrap-around-the-workspace'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    shift-alt-cmd-ctrl-h = 'move left'
    shift-alt-cmd-ctrl-j = 'move down'
    shift-alt-cmd-ctrl-k = 'move up'
    shift-alt-cmd-ctrl-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-cmd-ctrl-minus = 'resize smart -50'
    alt-cmd-ctrl-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-cmd-a = 'workspace A'
    ctrl-alt-cmd-s = 'workspace S'
    ctrl-alt-cmd-d = 'workspace D'
    ctrl-alt-cmd-w = 'workspace W'
    ctrl-alt-cmd-q = 'workspace Q'
    ctrl-alt-cmd-e = 'workspace E'
    ctrl-alt-cmd-f = 'workspace F'
    ctrl-alt-cmd-r = 'workspace R'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    shift-ctrl-alt-cmd-a = 'move-node-to-workspace A'
    shift-ctrl-alt-cmd-s = 'move-node-to-workspace S'
    shift-ctrl-alt-cmd-d = 'move-node-to-workspace D'
    shift-ctrl-alt-cmd-w = 'move-node-to-workspace W'
    shift-ctrl-alt-cmd-q = 'move-node-to-workspace Q'
    shift-ctrl-alt-cmd-e = 'move-node-to-workspace E'
    shift-ctrl-alt-cmd-f = 'move-node-to-workspace F'
    shift-ctrl-alt-cmd-r = 'move-node-to-workspace R'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    ctrl-alt-cmd-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    shift-ctrl-alt-cmd-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    shift-alt-cmd-ctrl-semicolon = 'mode service'

# ============================================================
# SERVICE BINDING MODE
# ============================================================
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    shift-alt-cmd-ctrl-h = ['join-with left', 'mode main']
    shift-alt-cmd-ctrl-j = ['join-with down', 'mode main']
    shift-alt-cmd-ctrl-k = ['join-with up', 'mode main']
    shift-alt-cmd-ctrl-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# ============================================================
# APP AUTO-ASSIGNMENT
#   Verify bundle IDs with:  aerospace list-apps
# ============================================================

# --- Code (A): editors/IDEs ---
[[on-window-detected]]
    if.app-id = 'com.jetbrains.PhpStorm'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'dev.zed.Zed'
    run = 'move-node-to-workspace A'

[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'
    run = 'move-node-to-workspace A'

# --- Terminal (S) ---
[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'
    run = 'move-node-to-workspace S'

# --- AI (D): Claude Desktop ---
[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = 'move-node-to-workspace D'

# --- Web (W): browsers ---
[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace W'

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace W'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace W'

[[on-window-detected]]
    if.app-id = 'net.librewolf.librewolf'
    run = 'move-node-to-workspace W'

# --- Design (Q): Adobe apps ---
[[on-window-detected]]
    if.app-id = 'com.adobe.illustrator'
    if.window-title-regex-substring = 'Document Setup|Expand|Color Picker'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.adobe.Photoshop'
    if.window-title-regex-substring = 'New Document|Color Picker|Preferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-name-regex-substring = '^Adobe'
    run = ['layout tiling', 'move-node-to-workspace Q']

# --- Files / DB / Docker (E) ---
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'move-node-to-workspace E'

[[on-window-detected]]
    if.app-id = 'com.tinyapp.TablePlus'
    run = 'move-node-to-workspace E'

[[on-window-detected]]
    if.app-id = 'com.tableplus.TableTool'
    run = 'move-node-to-workspace E'

[[on-window-detected]]
    if.app-id = 'com.docker.docker'
    run = 'move-node-to-workspace E'

# --- Comms (F): Slack + Teams, stacked (accordion) ---
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    if.window-title-regex-substring = 'Huddle'
    run = ['move-node-to-workspace F', 'layout floating']

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = ['move-node-to-workspace F', 'layout v_accordion']

[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = ['move-node-to-workspace F', 'layout v_accordion']

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = ['move-node-to-workspace F', 'layout v_accordion']

# --- Email (R): Outlook ---
[[on-window-detected]]
    if.app-id = 'com.microsoft.Outlook'
    run = ['move-node-to-workspace R', 'layout v_accordion']

[[on-window-detected]]
    if.app-id = 'ch.protonmail.desktop'
    run = ['move-node-to-workspace R', 'layout v_accordion']
